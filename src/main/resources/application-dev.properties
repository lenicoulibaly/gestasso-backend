spring.application.name=gestasso
server.port=7000

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Main Datasource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/gestasso_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.jpa.hibernate.ddl-auto=update

# Keycloak Datasource configuration
spring.datasource.keycloak.url=jdbc:postgresql://localhost:5432/keycloak
spring.datasource.keycloak.username=postgres
spring.datasource.keycloak.password=admin
spring.jpa.keycloak.hibernate.ddl-auto=none

#Configuration
